name: Deploy

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/desenvolvimento-gw-2026/licencas-app/app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push scheduler
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.scheduler
          push: true
          tags: ghcr.io/desenvolvimento-gw-2026/licencas-app/scheduler:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GHCR_PAT
          script: |
            echo "$GHCR_PAT" | docker login ghcr.io -u desenvolvimento-gw-2026 --password-stdin
            cd /opt/licencas-app
            git pull origin master
            docker compose pull app scheduler
            docker compose up -d --remove-orphans
            docker image prune -f
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
